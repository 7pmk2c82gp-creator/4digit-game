<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>4桁コードチャレンジ</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    #code {
      font-size: 42px;
      letter-spacing: 10px;
      margin: 25px 0;
      font-weight: bold;
    }

    input {
      font-size: 24px;
      width: 180px;
      padding: 10px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      font-size: 17px;
      padding: 12px 18px;
      margin: 8px 4px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    /* 判定結果 */
    #result {
      margin-top: 20px;
    }

    #resultIcon {
      font-size: 90px;
      line-height: 1;
      margin: 15px 0;
    }

    #resultText {
      font-size: 28px;
      font-weight: bold;
    }

    #hint {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.8;
    }

    #attempts {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>4桁コードチャレンジ</h1>

  <p>4桁のコードを当てよう！</p>

  <div id="code">？？？？</div>

  <input
    id="answer"
    type="text"
    inputmode="numeric"
    maxlength="4"
    placeholder="4桁を入力"
  >

  <br>

  <button onclick="checkAnswer()">判定</button>

  <button onclick="newQuestion()">新しい問題</button>

  <div id="result">

    <div id="resultIcon"></div>

    <div id="resultText"></div>

  </div>

  <div id="hint"></div>

  <div id="attempts">
    試行回数：0回
  </div>

</div>

<script>

let correctCode = "";
let attemptCount = 0;


// 新しい問題
function newQuestion() {

  const number = Math.floor(Math.random() * 10000);

  correctCode = String(number).padStart(4, "0");

  attemptCount = 0;

  document.getElementById("code").textContent = "？？？？";

  document.getElementById("answer").value = "";

  document.getElementById("resultIcon").textContent = "";

  document.getElementById("resultText").textContent = "";

  document.getElementById("hint").textContent = "";

  document.getElementById("attempts").textContent =
    "試行回数：0回";
}


// 判定
function checkAnswer() {

  const answer = document.getElementById("answer").value;

  // 4桁チェック
  if (!/^\d{4}$/.test(answer)) {

    document.getElementById("resultIcon").textContent = "⚠️";

    document.getElementById("resultText").textContent =
      "4桁の数字を入力してね";

    return;
  }


  attemptCount++;

  document.getElementById("attempts").textContent =
    "試行回数：" + attemptCount + "回";


  // HIGH / LOW
  const guessNumber = Number(answer);
  const correctNumber = Number(correctCode);

  let highLow = "";

  if (guessNumber > correctNumber) {

    highLow = "LOW 🔽";

  } else if (guessNumber < correctNumber) {

    highLow = "HIGH 🔼";

  }


  // 位置一致
  let positionMatch = 0;

  for (let i = 0; i < 4; i++) {

    if (answer[i] === correctCode[i]) {
      positionMatch++;
    }

  }


  // 正解
  if (answer === correctCode) {

    document.getElementById("resultIcon").textContent = "🎉";

    document.getElementById("resultText").textContent =
      "正解！";

    document.getElementById("hint").innerHTML =
      "答え：<strong>" + correctCode + "</strong><br>" +
      "位置一致：<strong>4 / 4</strong>";

  }

  // 不正解
  else {

    document.getElementById("resultIcon").textContent = "❌";

    document.getElementById("resultText").textContent =
      "不正解";

    document.getElementById("hint").innerHTML =
      "HIGH / LOW：<strong>" + highLow + "</strong><br>" +
      "位置一致：<strong>" + positionMatch + " / 4</strong>";

  }

}


// 最初の問題
newQuestion();

</script>

</body>
</html>
